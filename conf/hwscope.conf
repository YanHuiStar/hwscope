# =============================================================================
# HwScope 采集工具 - 配置文件
# conf/hwscope.conf
# =============================================================================

# ─── BMC 配置（远程采集时需要） ───
BMC_IP=""                          # 留空跳过 BMC 远程采集，只查本地 IPMI
BMC_USER="admin"
BMC_PASS="admin"
BMC_INTERFACE="lanplus"            # lan / lanplus

# ─── 模块开关（1=启用 0=跳过） ───
MODULE_MB=1          # 主板/BIOS/机箱（dmidecode）
MODULE_CPU=1         # CPU 信息（dmidecode + lscpu）
MODULE_MEMORY=1      # 内存插槽/容量/速率（dmidecode）
MODULE_GPU=1         # GPU 信息（nvidia-smi）
MODULE_NVSWITCH=1    # NVSwitch（nvswitch + fabric-manager）
MODULE_PCIE=1        # PCIe 拓扑（lspci）
MODULE_NETWORK=1     # 网络/IB/光模块（ibstat + mlxlink + ethtool）
MODULE_STORAGE=1     # 存储设备：SATA/SAS/NVMe + SMART（lsblk + smartctl）
MODULE_RAID=1        # RAID/HBA 卡（storcli64 / sas3ircu）
MODULE_PSU=1         # 电源 PSU（IPMI + sysfs）
MODULE_FAN=1         # 风扇 FAN（IPMI + hwmon + sensors）
MODULE_BMC=1         # BMC/IPMI 完整信息（ipmitool + Redfish）
MODULE_NVSM=1        # NVSM（自动检测是否存在）
MODULE_DCGM=1        # DCGM 诊断（自动检测是否存在）
MODULE_FIRMWARE=1    # 固件合规（GPU VBIOS/BMC/NIC/NVSwitch，对照 conf/fw_required.txt）
MODULE_POWER=1       # 能耗台账（BMC 累计能耗 + DCMI/Redfish 功耗快照）
MODULE_OS=1          # OS 基础信息

# ─── Mellanox MST 自动启动（验收/交付场景默认启动，root 下自动 mst start） ───
# 0=不自动启动（SN 以 GUID 兜底并提示）；1=检测到未启动时自动 mst start 读真 SN
MST_AUTO_START=1

# ─── DCGM hostengine 自动启动（discovery/stats 依赖 hostengine 服务） ───
# 0=不自动启动（discovery/stats 失败，仅 diag 可用）；1=检测到未启动时自动拉起
DCGM_AUTO_START=1

# ─── HGX 基板 BMC IP（直连 HGX 板载管理口） ───
# 默认留空：非 HGX 机器不连接；SXM/HGX 平台请填写板载 BMC 地址
HGX_BMC_IP=""
HGX_BMC_USER="admin"
HGX_BMC_PASS="admin"

# ─── 输出目录 ───
# 留空则自动生成 output/<机器ID>/（机器ID = SN → 主板SN → UUID → 时间戳兜底）
OUTPUT_BASE_DIR=""

# ─── 运行模式 ───
FORCE=0
MODULE_PARALLEL=1       # 1=模块内命令并行（默认） 0=逐条串行（--no-parallel）
MODULE_TIMEOUT=300      # 单模块超时秒数（--module-timeout 可覆盖）

# ─── 模拟模式（演示/测试用） ───
# SIM_DELAY=0 关闭；>0 时每模块模拟 N 秒耗时（可用 --sim [N] 覆盖）
SIM_DELAY=0

# ─── BMC/IPMI 预热 ───
# 虚空跑一次 ipmitool 不计入日志（触发驱动加载/BMC 初始化，避免首次命令失败）
IPMI_PREHEAT=1
